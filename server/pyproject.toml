[project]
name = "sermon-translate-server"
version = "0.1.0"
description = "Real-time sermon translation server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiortc>=1.12.0",
    "edge-tts>=6.1.0",
    "faster-whisper>=1.1.0",
    "fastapi>=0.135.1",
    "numpy>=1.23",
    "sentencepiece>=0.2.0",
    "torch>=2.0",
    "torchaudio>=2.0",
    "transformers>=4.44,<5",
    "uvicorn[standard]>=0.41.0",
]

[project.optional-dependencies]
seamless = [
    "seamless-communication",
]
listen-kyutai = [
    "moshi>=0.2.6",
    "julius>=0.2.7",
    "sphn>=0.1.4",
]
tts-qwen = []
tts-pocket = [
    "pocket-tts>=0.1.0",
]
prosody-pyworld = [
    "pyworld>=0.3.4",
]
translate-llm = []
stages-all = [
    "sermon-translate-server[seamless,prosody-pyworld,listen-kyutai,tts-pocket]",
]

[project.scripts]
serve = "uvicorn src.main:app --reload --host 0.0.0.0 --port 8000"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pyright>=1.1.408",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.4",
]

[tool.uv.sources]
seamless-communication = { git = "https://github.com/aleksclark/seamless_communication.git", branch = "main" }

[tool.uv]
override-dependencies = ["numpy>=2"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
